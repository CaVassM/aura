# Traducciones de motivo y afinidades entre necesidad y tipo de servicio.
motivo_a_servicio:
  academic_pressure: counseling # PROVISIONAL
  sleep_and_routine: counseling # PROVISIONAL
  social_support: peer_support # PROVISIONAL
  career_concern: career_guidance # PROVISIONAL
  preventive_guidance: counseling # PROVISIONAL
  # Pendientes, comentados para no alterar los motivos activos del motor/agente.
  service_navigation: peer_support # PROVISIONAL
  # work_study_balance: counseling # PROVISIONAL: candidato, requiere decisión
afinidad:
  counseling:
    counseling: 1.0 # PROVISIONAL
    peer_support: 0.6 # PROVISIONAL
    career_guidance: 0.3 # PROVISIONAL
  peer_support:
    peer_support: 1.0 # PROVISIONAL
    counseling: 0.6 # PROVISIONAL
    career_guidance: 0.4 # PROVISIONAL
  career_guidance:
    career_guidance: 1.0 # PROVISIONAL
    counseling: 0.3 # PROVISIONAL
    peer_support: 0.4 # PROVISIONAL

# Qué bloques de reglas son supuestos provisionales (los lee /api/coordinacion/reglas).
provisional:
  motivo_servicio: true
  afinidad: true
  umbral_afinidad: true
  aviso: false
  p_asistencia: false
  pesos: true

# Etiquetas en español para la API; las claves son los códigos de los datos.
etiquetas:
  tipo:
    counseling: Consejería
    peer_support: Apoyo entre pares
    career_guidance: Orientación vocacional
  motivo:
    academic_pressure: Presión académica
    sleep_and_routine: Sueño y rutina
    social_support: Apoyo social
    career_concern: Inquietud vocacional
    preventive_guidance: Orientación preventiva
    service_navigation: Conocer los servicios
  canal:
    digital: Videollamada
    phone: Teléfono
    in_person: Presencial
  grupo:
    diurno: Diurno
    nocturno: Nocturno
  grupo_plural:
    diurno: estudiantes diurnos
    nocturno: estudiantes nocturnos
  nivel:
    baja: Baja
    media: Media
    alta: Alta
  dias_semana: [Lun, Mar, Mié, Jue, Vie, Sáb, Dom]
  dias_semana_largo: [lunes, martes, miércoles, jueves, viernes, sábado, domingo]
  pesos:
    Z1: Estudiantes sin cita
    Z2: Espera ajustada por canal
    Z3: Equilibrio entre servicios
    Z4: Espera del grupo peor atendido
    Z5: Pérdida de afinidad
  # Valores de los datos que se muestran al usuario (alerta de abandono: low/medium/high).
  valores:
    low: baja
    medium: media
    high: alta
    evaluation_week: una semana de evaluaciones
  senales:
    S1:
      nombre: Temporada de evaluación
      descripcion: "Hoy cae en {umbral} del calendario académico (D7)."
    S2:
      nombre: Caída de asistencia
      descripcion: "La tasa de asistencia bajó al menos {umbral} frente al período anterior."
    S3:
      nombre: Caída de nota
      descripcion: "El cambio de nota es menor o igual que {umbral}."
    S4:
      nombre: Carga de créditos alta
      descripcion: "Los créditos están en el percentil {umbral} o más del período."
  franja_principal: "entre {desde} y {hasta}, {dias}"
  insight: "{pct} % de los desencuentros son de {grupo} que buscan {servicio} entre las {desde} y las {hasta}."
  insight_vacio: "No hay desencuentros con estos filtros."
